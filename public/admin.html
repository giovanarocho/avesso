<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · afetue</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo-marrom.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&family=Gaegu:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="js/admin.js" defer></script>
<style>
body{background:#f6f1e8}
.barra{background:var(--verde);color:#eef0e8}
.barra .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.barra .marca img{height:40px}
.barra .titulo{font-family:var(--mao);font-size:1.4rem;color:var(--amarelo);margin-left:10px}
.barra button{background:none;border:1px solid rgba(242,238,176,.5);color:var(--amarelo);border-radius:999px;padding:7px 14px;font:500 .9rem var(--sans);cursor:pointer}
main{padding-block:28px 80px}

/* login */
#login{max-width:380px;margin:10vh auto 0;display:grid;gap:16px;background:var(--papel);padding:32px;border-radius:18px;border:1px solid var(--linha)}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;display:grid;gap:2px}
.tile span{font-size:.8rem;color:var(--tinta-suave)}
.tile strong{font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{font-size:.8rem;color:var(--tinta-suave)}
.tile.alerta{border-color:var(--oliva);background:#f7f3d6}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* filtros */
.ferramentas{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 .88rem var(--sans);background:var(--papel);border:1px solid var(--linha);color:var(--tinta);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--marrom);border-color:var(--marrom);color:var(--papel)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
#busca{max-width:260px;margin-left:auto;padding:9px 14px;border-radius:999px}
@media (max-width:700px){#busca{max-width:none;margin-left:0}}

/* tabela */
.tabela{overflow-x:auto;background:var(--papel);border:1px solid var(--linha);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.93rem}
th{text-align:left;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--linha);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fff}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:.82rem;color:var(--tinta-suave)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.vazio{padding:40px;text-align:center;color:var(--tinta-suave)}

.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-pago{background:#e3e8da;color:var(--verde)}
.p-pendente{background:#f2eeb0;color:#6a5a17}
.p-cancelado,.p-reembolsado{background:#f3dcd6;color:var(--vinho)}
.l-aguardando{background:#f2eeb0;color:#6a5a17}
.l-enviado{background:#dfe6f3;color:#2f4a78}
.l-em_producao{background:#efe2d0;color:var(--marrom-escuro)}
.l-na_grafica{background:#e6dcf0;color:#4b3170}
.l-entregue{background:#e3e8da;color:var(--verde)}
.l-nenhum{background:transparent;color:var(--tinta-suave);font-weight:400}

/* detalhe */
#detalhe{max-width:min(880px,calc(100vw - 24px));margin:24px auto;max-height:calc(100vh - 48px)}
#detalhe .corpo{padding:28px;display:grid;gap:24px;overflow-y:auto;max-height:calc(100vh - 48px)}
#detalhe header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
#detalhe h2{font-size:1.6rem}
.fechar-d{background:none;border:0;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--tinta-suave)}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
.grade div{display:grid;gap:2px}
.grade span{font-size:.8rem;color:var(--tinta-suave)}
@media (max-width:620px){.grade{grid-template-columns:1fr}}
.caixa{border:1px solid var(--linha);border-radius:14px;padding:18px;display:grid;gap:14px;background:#fff}
.caixa h3{font-size:1.1rem}
.acoes-d{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acoes-d select{width:auto;padding:9px 12px}
.acoes-d .btn{padding:11px 18px;font-size:.92rem}
.paginas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pag{display:grid;gap:6px;font-size:.88rem}
.pag{min-width:0}
.pag .img,.foto-g{width:100%;aspect-ratio:1;border-radius:8px;background:var(--kraft) center/cover no-repeat;border:1px solid var(--linha);display:block}
.pag b{font-size:.78rem;color:var(--marrom);letter-spacing:.06em;text-transform:uppercase}
.especiais{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){.especiais{grid-template-columns:1fr 1fr}}
.endereco{white-space:pre-line;font-size:.95rem}
.demo{background:var(--amarelo);color:var(--marrom-escuro);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:.92rem}
.nota{font-size:.85rem;color:var(--tinta-suave)}
.duas-c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha-check{display:flex;gap:10px;align-items:center}
.linha-check input{width:18px;height:18px;accent-color:var(--marrom)}
</style>
</head>
<body>
<div class="barra">
  <div class="wrap">
    <div style="display:flex;align-items:center"><a class="marca" href="index.html"><img src="assets/logo-amarelo.svg" alt="afetue"></a><span class="titulo">painel</span></div>
    <button type="button" id="sair" hidden>Sair</button>
  </div>
</div>

<main class="wrap">
  <form id="login" hidden>
    <h1 style="font-size:1.6rem">Entrar no painel</h1>
    <label for="senha">Senha<input id="senha" type="password" autocomplete="current-password" required></label>
    <div id="login-msg" hidden></div>
    <button class="btn" type="submit">Entrar</button>
  </form>

  <div id="painel" hidden>
    <div id="aviso-demo" class="demo" hidden>Dados de exemplo. No site no ar, aqui aparecem as compras de verdade.</div>
    <div class="tiles" id="tiles"></div>
    <div class="ferramentas">
      <div class="chips" id="chips" role="group" aria-label="Filtrar pedidos"></div>
      <input id="busca" type="search" placeholder="Buscar nome, e-mail ou título" aria-label="Buscar">
      <button class="chip" type="button" id="csv">Baixar planilha</button>
      <button class="chip" type="button" id="abrir-config" style="background:var(--verde);border-color:var(--verde);color:var(--amarelo)">Preços e turma</button>
    </div>
    <div class="tabela">
      <table>
        <thead><tr><th>Data</th><th>Cliente</th><th>Plano</th><th>Valor</th><th>Pagamento</th><th>Livro</th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
      <div class="vazio" id="vazio" hidden>Nenhum pedido neste filtro.</div>
    </div>
  </div>
</main>

<dialog id="config" aria-labelledby="cfg-titulo">
  <form id="form-config" method="dialog">
    <button class="fechar" type="button" aria-label="Fechar">×</button>
    <div style="display:grid;gap:4px">
      <h2 id="cfg-titulo" style="font-size:1.5rem">Preços e turma</h2>
      <p class="small">O que você salvar aqui aparece no site em até 1 minuto e vale pras próximas compras.</p>
    </div>
    <div class="duas-c">
      <label for="cfg-kit">Só o kit (R$)<input id="cfg-kit" name="precoKit" type="text" inputmode="decimal" required></label>
      <label for="cfg-livro">Kit + livro (R$)<input id="cfg-livro" name="precoKitLivro" type="text" inputmode="decimal" required></label>
    </div>
    <div class="duas-c">
      <label for="cfg-vagas">Vagas de livro<input id="cfg-vagas" name="vagasTotal" type="number" min="0" required></label>
      <label for="cfg-ate">Inscrições até<input id="cfg-ate" name="inscricoesAte" type="text" placeholder="30/10"></label>
    </div>
    <label for="cfg-nome">Nome da turma<input id="cfg-nome" name="nome" type="text" required></label>
    <label class="linha-check" for="cfg-aberta"><input id="cfg-aberta" name="aberta" type="checkbox"> Inscrições abertas</label>
    <div id="cfg-msg" hidden></div>
    <button class="btn" type="submit">Salvar</button>
  </form>
</dialog>

<dialog id="detalhe" aria-labelledby="d-titulo">
  <div class="corpo" id="d-corpo"></div>
</dialog>
</body>
</html>
